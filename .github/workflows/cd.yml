name: CD

# Build and push images to GHCR on every push to main, then (optionally) deploy
# over SSH. SCAFFOLDING: no deployment target exists yet, so the deploy job has
# never been executed. It is skipped with a notice until the DEPLOY_* secrets
# below are configured. See docs/ci-cd.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-finished deploy

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: Build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write # push to GHCR with the built-in GITHUB_TOKEN
    outputs:
      app_image: ${{ steps.names.outputs.app }}
      collab_image: ${{ steps.names.outputs.collab }}
      tag: ${{ steps.names.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Compute image names (GHCR requires lowercase)
        id: names
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "app=${REGISTRY}/${repo}-app" >> "$GITHUB_OUTPUT"
          echo "collab=${REGISTRY}/${repo}-collab" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ steps.names.outputs.app }}:${{ github.sha }}
            ${{ steps.names.outputs.app }}:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
          build-args: |
            NEXT_PUBLIC_COLLAB_WS_URL=${{ vars.NEXT_PUBLIC_COLLAB_WS_URL }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          # OPTIONAL: Sentry source-map upload token (empty/unset = no upload).
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

      # One-shot schema-sync image used by docker-compose's `migrate` service.
      - name: Build and push tools (prisma db push) image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          push: true
          tags: |
            ${{ steps.names.outputs.app }}-tools:${{ github.sha }}
            ${{ steps.names.outputs.app }}-tools:latest
          cache-from: type=gha,scope=app
          build-args: |
            NEXT_PUBLIC_COLLAB_WS_URL=${{ vars.NEXT_PUBLIC_COLLAB_WS_URL }}

      - name: Build and push collab server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ steps.names.outputs.collab }}:${{ github.sha }}
            ${{ steps.names.outputs.collab }}:latest
          cache-from: type=gha,scope=collab
          cache-to: type=gha,mode=max,scope=collab

  deploy:
    name: Deploy (SSH + docker compose)
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Add required reviewers / wait timers to this Environment in repo settings.
    environment:
      name: production
    steps:
      - uses: actions/checkout@v6
      - name: Check deploy configuration
        id: gate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "::notice title=Deploy skipped::DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY (secrets) and DEPLOY_PATH (variable) are not all set. Images were still pushed."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        if: steps.gate.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS not set; trusting the host key on first contact (TOFU). Pin it for production."
            ssh-keyscan -p "${DEPLOY_SSH_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Copy compose file
        if: steps.gate.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          scp -i ~/.ssh/deploy_key -P "${DEPLOY_SSH_PORT:-22}" docker-compose.yml \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/docker-compose.yml"

      # The host keeps its own `.env` in DEPLOY_PATH (AUTH_SECRET, APP_URL,
      # POSTGRES_PASSWORD, optional OAuth/SMTP/Stripe). The CI never sees it.
      # `docker compose up -d` runs the `migrate` service (prisma db push) first.
      - name: Pull images and restart
        if: steps.gate.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          APP_IMAGE: ${{ needs.images.outputs.app_image }}
          COLLAB_IMAGE: ${{ needs.images.outputs.collab_image }}
          APP_TAG: ${{ needs.images.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_SSH_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "GHCR_USER='${GHCR_USER}' GHCR_TOKEN='${GHCR_TOKEN}' APP_IMAGE='${APP_IMAGE}' COLLAB_IMAGE='${COLLAB_IMAGE}' APP_TAG='${APP_TAG}' DEPLOY_PATH='${DEPLOY_PATH}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          if [ -n "$GHCR_TOKEN" ]; then
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          fi
          export APP_IMAGE COLLAB_IMAGE APP_TAG
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
          docker compose ps
          REMOTE
