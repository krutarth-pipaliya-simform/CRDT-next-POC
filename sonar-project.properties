# SonarQube Server / SonarQube Cloud analysis (PRD FR-24).
# sonar.projectKey / sonar.organization / host URL are supplied by CI from repo
# variables (SONAR_PROJECT_KEY, SONAR_ORGANIZATION, SONAR_HOST_URL); the key
# below is only a fallback for local scans.
sonar.projectKey=crdt-next-poc
sonar.projectName=CRDT Collaborative Workspace

sonar.sourceEncoding=UTF-8
sonar.sources=src,server/src,prisma
sonar.tests=src,e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,e2e/**
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/node_modules/**,**/.next/**,**/dist/**,**/coverage/**,**/*.d.ts,prisma/migrations/**,prisma/seed.ts,storage/**,src/generated/**

# Coverage is produced by `npm run test:coverage` (Jest) and handed over by CI.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,e2e/**,src/app/**/layout.tsx,src/app/**/loading.tsx,src/app/**/error.tsx,src/app/**/not-found.tsx,**/*.config.ts

sonar.typescript.tsconfigPaths=tsconfig.json,server/tsconfig.json
